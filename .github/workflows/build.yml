name: Build

on:
  push:
    branches:
      - '**'
  pull_request:
  release:
    types: [published]

# Read-only by default. Only `publish` may write: it attaches the files the
# build jobs made and runs no code from this repository.
permissions:
  contents: read

env:
  BUILD_TYPE: Release
  EM_VERSION: 2.0.18
  EM_CACHE_FOLDER: 'emsdk-cache'

jobs:
  build:
    name: ${{matrix.name}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Desktop (tests)
            cmake-args: -D32BLIT_DIR=$GITHUB_WORKSPACE/32blit-sdk
            apt-packages: libsdl2-dev libsdl2-image-dev libsdl2-net-dev python3-setuptools
            test: true

          - name: Web
            cmake-args: -D32BLIT_DIR=$GITHUB_WORKSPACE/32blit-sdk
            cmake-prefix: emcmake
            apt-packages: python3-setuptools

          - name: Console (.blit)
            cmake-args: -D32BLIT_DIR=$GITHUB_WORKSPACE/32blit-sdk -DPICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk -DPICO_EXTRAS_PATH=$GITHUB_WORKSPACE/pico-extras -DPICO_BOARD=chilichip_vgc -DPICO_PLATFORM=rp2350-arm-s -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/32blit-sdk/pico2.toolchain -DBLIT_EXECUTABLE_PICO_BLIT=1
            apt-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib python3-setuptools
            pico: true

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: main

      - name: Checkout 32blit SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: chili-chip/32blit-sdk
          path: 32blit-sdk

      - name: Checkout Pico SDK
        if: matrix.pico
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: chili-chip/pico-sdk
          path: pico-sdk
          submodules: true

      - name: Checkout Pico Extras
        if: matrix.pico
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: chili-chip/pico-extras
          path: pico-extras

      - name: Install deps
        run: |
          sudo apt update && sudo apt install ${{matrix.apt-packages}}
          pip3 install 32blit "bitstring<5"

      - name: Setup Emscripten cache
        if: matrix.name == 'Web'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{env.EM_CACHE_FOLDER}}
          key: ${{env.EM_VERSION}}-${{runner.os}}

      - name: Setup Emscripten
        if: matrix.name == 'Web'
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{env.EM_VERSION}}
          actions-cache-folder: ${{env.EM_CACHE_FOLDER}}

      - name: Pre-build Emscripten ports
        if: matrix.name == 'Web'
        # GitHub archive downloads sometimes come back broken, so retry.
        # Ports that already built stay in the cache between tries.
        run: |
          for i in 1 2 3 4; do
            embuilder.py build sdl2 sdl2-image-jpg sdl2-net && exit 0
            sleep 30
          done
          exit 1

      - name: Configure
        shell: bash
        run: ${{matrix.cmake-prefix}} cmake -S main -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE ${{matrix.cmake-args}}

      - name: Build
        shell: bash
        run: cmake --build build --config $BUILD_TYPE -j 2

      - name: Test
        if: matrix.test
        run: ctest --test-dir build --output-on-failure

      - name: Validate the RPG demo's game file
        if: matrix.test
        run: |
          pip3 install "jsonschema>=4.18"
          python3 main/format/validate.py main/examples/rpg/assets/pepper.rpg main/examples/rpg/assets/pepper-village.rpg

      - name: Upload the console apps
        if: matrix.pico
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chili-rpg-blit
          path: build/**/chili-rpg.blit
          if-no-files-found: error

  # The RPG web player (players/rpg/web), for the creator and the platform.
  web-player:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: main

      - name: Checkout 32blit SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: chili-chip/32blit-sdk
          path: 32blit-sdk

      - name: Install the 32blit tools
        run: pip3 install 32blit "bitstring<5"

      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Major only: each run takes the newest security release of the LTS.
          node-version: "26"

      - name: Build
        run: |
          emcmake cmake -S main/players/rpg/web -B build-web -DCMAKE_BUILD_TYPE=Release -D32BLIT_DIR=$GITHUB_WORKSPACE/32blit-sdk
          cmake --build build-web --target chili-rpg -j 2

      - name: Test in Node
        run: node main/players/rpg/web/test.mjs build-web

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chili-rpg-web
          path: |
            build-web/chili-rpg.js
            build-web/chili-rpg.wasm
            build-web/player.js
            build-web/index.html
            build-web/pepper-village.rpg
          if-no-files-found: error

  # The only job that may write: it attaches the release files the build jobs
  # made. It runs even when one build failed, so the other files still go up.
  publish:
    if: ${{ !cancelled() && github.event_name == 'release' }}
    needs: [build, web-player]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: chili-rpg-*
          path: release
          merge-multiple: true
      - name: Attach to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          fail_on_unmatched_files: false
          files: |
            release/chili-rpg.blit
            release/chili-rpg.js
            release/chili-rpg.wasm
            release/player.js
